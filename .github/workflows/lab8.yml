name: Commit Lint Workflow

on:
    push: 
        branches: [master, main]
    pull_request:

jobs: 
    lint_commit: 
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: lint commit message
              uses: ./.github/actions/commit-lint-docker
              with: 
                commit-message: ${{ github.event.head_commit.message }}


