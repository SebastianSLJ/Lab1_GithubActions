name: matrix test

on:
    push

jobs: 
    main_matrix:        
        runs-on: ${{matrix.os}}
        strategy:
            fail-fast: false
            matrix:
                python-version: ['3.10', '3.11', '3.12']
                os: [ubuntu-latest, windows-latest]
                include: 
                    - os: ubuntu-latest
                      python-version: '3.13'
                exclude: 
                    - os: windows-latest 
                      python-version: '3.10'
        steps: 
            - uses: actions/setup-python@v5
              with: 
                python-version: ${{ matrix.python-version }}
            - name: Print info
              run: echo "OS ${{ matrix.os }} and - Python ${{ matrix.python-version }}"


