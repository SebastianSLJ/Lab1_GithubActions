name: Test-action

on: 
    push

jobs: 
    job1: 
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Uses greeting custom action
              uses: ./.github/actions/my-action/action.yml
              with: 
                who-to-greet: 'Sebastian'
            - name: Print output from custom action
              run: echo "The greeting time was ${{ steps.saved-time.outputs.greeting_time}}"           